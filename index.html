assName:`flex items-center gap-1.5 px-3.5 py-2.5 text-xs md:text-sm font-semibold tracking-wide rounded-xl transition duration-200 border ${T?"bg-amber-500 text-slate-950 border-amber-500 font-bold shadow-md shadow-amber-500/20":"bg-slate-800/80 text-slate-300 border-slate-700 hover:bg-slate-700/80 hover:text-white"}`,children:[s.jsx(E,{className:"h-4 w-4"}),s.jsx("span",{children:d.label})]},d.id)})})]})})})},Ma=[{id:"chap-1",number:"I",title:"Preliminary",summary:"Deals with the short title, extent, commencement, and basic definitions of types of vehicles, authorities, and permissions used across the Motor Vehicles Act.",sections:[{id:"sec-1",section:"1",title:"Short title, extent and commencement",summary:"This Act may be called the Motor Vehicles Act, 1988.",details:"It extends to the whole of India. It shall come into force on such date as the Central Government may, by notification in the Official Gazette, appoint."},{id:"sec-2",section:"2",title:"Definitions",summary:"Comprehensive definitions for vehicles, licenses, conductors, learners, transport vehicles, etc.",details:"Defines 'heavy goods vehicle', 'light motor vehicle', 'learner’s licence', 'omnibus', 'private service vehicle', and over 40 other distinct terms."}]},{id:"chap-2",number:"II",title:"Licensing of Drivers of Motor Vehicles",summary:"Sets out the requirements for driving licenses, age limits for operating various vehicle classes, procedures for granting and renewing licenses, and grounds for disqualification.",sections:[{id:"sec-3",section:"3",title:"Necessity for driving licence",summary:"No person shall drive a motor vehicle in any public place unless he holds an effective driving licence.",fine:"₹5,000",penaltyCategory:"Licensing",details:"Drivers must hold a license authorizing them to drive the specific vehicle class. Driving a transport vehicle requires a specific authorization endorseable by a licensing authority."},{id:"sec-4",section:"4",title:"Age limit in connection with driving of motor vehicles",summary:"Provides the minimum ages for driving motor vehicles in public places: 18 years for general, 16 years for below 50cc, and 20 years for transport.",details:"No person under the age of 18 years shall drive a motor vehicle in any public place. A motor cycle with an engine capacity not exceeding 50cc may be driven by a person after attaining the age of 16 years. A transport vehicle requires the operator to be at least 20 years old."},{id:"sec-5",section:"5",title:"Responsibility of owners of motor vehicles for contravention of sections 3 and 4",summary:"No owner shall permit any person who doesn't satisfy Section 3 or 4 to drive their vehicle.",fine:"₹5,000",penaltyCategory:"Licensing",details:"The vehicle owner bears absolute legal responsibility to ensure that no unlicensed person or minor operates their vehicle. Violations attract fines and imprisonment for the owner."},{id:"sec-14",section:"14",title:"Currency of licences to drive motor vehicles",summary:"Defines the validity period for different types of driving licences.",details:"A learner's licence is valid for 6 months. General driving licences are valid for up to 20 years or until the person attains the age of 40 years, whichever is earlier."}]},{id:"chap-3",number:"III",title:"Licensing of Conductors of Stage Carriages",summary:"Lays down the rules regarding the licensing of conductors of public transport stage carriages.",sections:[{id:"sec-29",section:"29",title:"Necessity for conductor’s licence",summary:"No person shall act as a conductor in a stage carriage unless he holds a valid conductor's licence.",details:"The state government may issue regulations regarding the qualifications, medical certificates, and conduct required for obtaining a conductor's licence."}]},{id:"chap-4",number:"IV",title:"Registration of Motor Vehicles",summary:"Contains mandates for the registration of all motor vehicles operating in India, the assignment of registration marks, transfers of ownership, and fitness certificates.",sections:[{id:"sec-39",section:"39",title:"Necessity for registration",summary:"No person shall drive or permit any motor vehicle to be driven in any public place unless the vehicle is registered.",fine:"₹2,000 - ₹5,000",penaltyCategory:"Registration",details:"Every vehicle must display a valid registration mark. Driving without valid registration or a temporary permit is an offence punishable under Section 192."},{id:"sec-41",section:"41",title:"Registration, how to be made",summary:"Provides the procedural steps for registering vehicles with state transport authorities.",details:"Requires application to be made by the owner in prescribed forms (e.g., Form 20), payment of registration fees, and inspection of the motor vehicle."},{id:"sec-50",section:"50",title:"Transfer of ownership",summary:"Mandates recording of vehicle transfers with the registering authority within prescribed timelines.",details:"The transferor must report the change within 14 days if the vehicle goes to someone within the same state, and 30 days if it moves out of the state."}]},{id:"chap-5",number:"V",title:"Control of Transport Vehicles",summary:"Deals with the control and regulation of transport vehicles, requiring valid permits to carry goods or passengers.",sections:[{id:"sec-66",section:"66",title:"Necessity for permits",summary:"No owner of a transport vehicle shall use or permit the use of the vehicle in any public place whether or not such vehicle is actually carrying any passengers or goods save in accordance with the conditions of a permit.",fine:"Up to ₹10,000",penaltyCategory:"Registration",details:"Vehicles carrying goods or passengers must have state-approved or national permits. Specific exemptions apply to emergency and military vehicles."}]},{id:"chap-6",number:"VI",title:"Special Provisions Relating to State Transport Undertakings",summary:"Grants state transport undertakings the right to operate bus services on specific routes as notified by the state government.",sections:[{id:"sec-98",section:"98",title:"Chapter to override Chapter V and other laws",summary:"Provisions of this chapter take precedence over other provisions for passenger transport.",details:"Provides mechanisms for State Transport Undertakings to monopolize or manage priority public transport routes for public welfare."}]},{id:"chap-7",number:"VII",title:"Construction, Equipment and Maintenance of Motor Vehicles",summary:"Sets statutory requirements on vehicle dimensions, emissions, brakes, speed governors, and maintenance standards.",sections:[{id:"sec-109",section:"109",title:"General provision regarding construction and maintenance of vehicles",summary:"Every vehicle must be constructed and maintained so as not to cause danger to the public.",details:"Provides standards for vehicle design, tires, lights, and emissions. Empowers testing authorities to inspect commercial and private vehicles."}]},{id:"chap-8",number:"VIII",title:"Control of Traffic",summary:"Directs speed limits, safety measures, traffic signs, parking rules, helmets, seatbelts, and rules for left-hand drive vehicles.",sections:[{id:"sec-112",section:"112",title:"Limits of speed",summary:"Speed limits must be strictly adhered to as set by the transport authorities for different roads.",fine:"₹1,000 - ₹2,000",penaltyCategory:"Driving Conduct",details:"Enables authorities to put up speed limit signs. Driving in excess of maximum speeds attracts penalties and license suspension under Section 183."},{id:"sec-119",section:"119",title:"Duty to obey traffic signs",summary:"Every driver must drive their vehicle in conformity with traffic signals and manual signals from traffic police.",fine:"₹500 - ₹1,500",penaltyCategory:"Driving Conduct",details:"Mandates obedience to red lights, stop signs, pedestrian crossings, and directions of authorized traffic officers."},{id:"sec-128",section:"128",title:"Safety measures for drivers and pillion riders",summary:"Only one pillion rider is allowed on a two-wheeler.",fine:"₹1,000",penaltyCategory:"Safety & Environment",details:"No driver of a two-wheeled motor cycle shall carry more than one person in addition to himself on the vehicle."},{id:"sec-129",section:"129",title:"Wearing of protective headgear (Helmets)",summary:"Every person above 4 years of age driving or riding a motorcycle must wear a protective headgear.",fine:"₹1,000 + 3 Months License Suspension",penaltyCategory:"Safety & Environment",details:"Helmets must conform to standards prescribed by the Central Government (e.g., ISI mark). Exceptions are allowed for specific religious groups (Sikhs wearing turbans)."}]},{id:"chap-9",number:"IX",title:"Motor Vehicles Temporarily Leaving Or Visiting India",summary:"Regulates vehicles crossing international borders, temporary transit, and valid cross-border permits.",sections:[{id:"sec-139",section:"139",title:"Power of Central Government to make rules",summary:"Central government rules governing tourist or personal vehicles entering/leaving India.",details:"Ensures compliance with international conventions regarding driving permits, vehicle registration, and insurance policies."}]},{id:"chap-10",number:"X",title:"Liability Without Fault in Certain Cases",summary:"Determines initial compensation for hit-and-run, permanent disablement, or death on a 'No Fault' basis.",sections:[{id:"sec-140",section:"140",title:"Liability to pay compensation in certain cases",summary:"Owners must compensate victims of death or permanent disablement even if no negligence is proven.",details:"Establishes structured compensation: ₹50,000 for death and ₹25,000 for permanent disablement without any burden of proof on the victim."}]},{id:"chap-11",number:"XI",title:"Insurance of Motor Vehicles Against Third Party Risks",summary:"Deals with the mandatory third-party insurance requirement for all motor vehicles operating in public spaces.",sections:[{id:"sec-146",section:"146",title:"Necessity for insurance against third part
